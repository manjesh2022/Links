<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔗 My Links Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0f1117;
  --surface: #151821;
  --surface-2: #1c202b;
  --surface-3: #202532;
  --border: #292e3a;
  --text: #ffffff;
  --text-secondary: #aeb4c0;
  --text-muted: #777f8f;
  --input-bg: #11141c;
  --card-bg: #151821;
  --hover: #202532;
  --shadow: rgba(0, 0, 0, 0.25);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --primary: rgb(124, 92, 255);
  --primary-hover: rgb(108, 76, 235);
}

body.light {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f0f1f5;
  --surface-3: #e7e9ef;
  --border: #dfe2e8;
  --text: #171923;
  --text-secondary: #626a78;
  --text-muted: #8a919f;
  --input-bg: #ffffff;
  --card-bg: #ffffff;
  --hover: #eef0f5;
  --shadow: rgba(0, 0, 0, 0.08);
  --danger: #dc2626;
  --danger-bg: rgba(220, 38, 38, 0.08);
  --primary: rgb(124, 92, 255);
  --primary-hover: rgb(108, 76, 235);
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  transition:
    background 0.25s ease,
    color 0.25s ease;
}

/* Hide scrollbars but keep scrolling */
* {
  scrollbar-width: none;
}

*::-webkit-scrollbar {
  display: none;
}

/* =========================
   APP
========================= */

.app {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 230px;
  min-width: 230px;
  min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 14px;

  display: flex;
  flex-direction: column;

  position: sticky;
  top: 0;
  height: 100vh;

  transition:
    background 0.25s ease,
    border-color 0.25s ease;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 25px;
  padding: 0 10px;
}

.category-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.category-btn {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text-secondary);

  padding: 11px 12px;
  border-radius: 9px;

  text-align: left;
  font-size: 14px;

  cursor: pointer;

  transition:
    background 0.2s ease,
    color 0.2s ease;
}

.category-btn:hover {
  background: var(--hover);
  color: var(--text);
}

.category-btn.active {
  background: rgb(124, 92, 255);
  color: #fff;
  font-weight: 600;
}

/* =========================
   MAIN
========================= */

.main {
  flex: 1;
  min-width: 0;
}

/* =========================
   HEADER
========================= */

.header {
  min-height: 70px;

  display: flex;
  align-items: center;
  gap: 9px;

  padding: 14px 20px;

  background: var(--surface);
  border-bottom: 1px solid var(--border);

  position: sticky;
  top: 0;
  z-index: 50;

  transition:
    background 0.25s ease,
    border-color 0.25s ease;
}

.search-box {
  flex: 1;
  min-width: 180px;
}

.search-box input {
  width: 100%;
  height: 40px;

  border: 1px solid var(--border);
  border-radius: 8px;

  padding: 0 13px;

  background: var(--input-bg);
  color: var(--text);

  outline: none;
  font-size: 14px;

  transition:
    background 0.25s ease,
    border-color 0.25s ease,
    color 0.25s ease;
}

.search-box input:focus {
  border-color: var(--primary);
}

.search-box input::placeholder {
  color: var(--text-muted);
}

.header-btn {
  height: 40px;

  border: 1px solid var(--border);
  border-radius: 8px;

  padding: 0 13px;

  background: var(--surface-2);
  color: var(--text-secondary);

  cursor: pointer;
  white-space: nowrap;

  font-size: 13px;
  font-weight: 600;

  transition:
    background 0.2s ease,
    color 0.2s ease,
    border-color 0.2s ease;
}

.header-btn:hover {
  background: var(--hover);
  color: var(--text);
}

.header-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.header-btn.primary:hover {
  background: var(--primary-hover);
}

.header-btn.danger {
  color: var(--danger);
}

.header-btn.danger:hover {
  background: var(--danger-bg);
}

/* =========================
   CONTENT
========================= */

.content {
  padding: 25px 20px 40px;
}

.content-top {
  margin-bottom: 18px;
}

.content-title {
  font-size: 22px;
  font-weight: 700;
}

.link-count {
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 5px;
}

/* =========================
   GRID
========================= */

.links-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

/* =========================
   CARD
========================= */

.link-card {
  position: relative;

  min-height: 135px;

  padding: 18px;

  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    background 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.2s ease;
}

.link-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  box-shadow: 0 8px 25px var(--shadow);
}

.link-card-icon {
  font-size: 28px;
  margin-bottom: 12px;
}

.link-card-title {
  padding-right: 60px;

  font-size: 15px;
  font-weight: 600;

  line-height: 1.4;

  word-break: break-word;
}

.link-card-type {
  display: inline-block;

  margin-top: 9px;

  padding: 4px 8px;

  background: var(--surface-2);
  color: var(--text-secondary);

  border: 1px solid var(--border);
  border-radius: 5px;

  font-size: 10px;
  font-weight: 600;
}

.link-card-category {
  margin-top: 8px;

  color: var(--text-muted);

  font-size: 11px;
}

/* =========================
   CARD ACTIONS
========================= */

.card-actions {
  position: absolute;
  top: 10px;
  right: 10px;

  display: flex;
  gap: 5px;

  opacity: 0;

  transition: opacity 0.2s ease;
}

.link-card:hover .card-actions {
  opacity: 1;
}

.card-action {
  width: 29px;
  height: 29px;

  border: 1px solid var(--border);
  border-radius: 6px;

  background: var(--surface-2);
  color: var(--text-secondary);

  cursor: pointer;

  font-size: 12px;
}

.card-action:hover {
  background: var(--hover);
  color: var(--text);
}

.card-action.delete:hover {
  color: var(--danger);
  background: var(--danger-bg);
}

/* =========================
   EMPTY STATE
========================= */

.empty-state {
  grid-column: 1 / -1;

  padding: 70px 20px;

  text-align: center;

  color: var(--text-muted);
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 15px;
}

.empty-title {
  color: var(--text);
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 7px;
}

.empty-text {
  font-size: 13px;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.55);

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  z-index: 200;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 500px;

  background: var(--surface);

  border: 1px solid var(--border);
  border-radius: 13px;

  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

  overflow: hidden;

  transition:
    background 0.25s ease,
    border-color 0.25s ease;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 18px 20px;

  border-bottom: 1px solid var(--border);
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
}

.close-btn {
  width: 32px;
  height: 32px;

  border: 0;
  border-radius: 7px;

  background: transparent;
  color: var(--text-secondary);

  cursor: pointer;

  font-size: 22px;
  line-height: 1;
}

.close-btn:hover {
  background: var(--hover);
  color: var(--text);
}

.modal-body {
  padding: 20px;
}

.form-group {
  margin-bottom: 17px;
}

.form-group:last-child {
  margin-bottom: 0;
}

.form-group label {
  display: block;

  margin-bottom: 7px;

  color: var(--text-secondary);

  font-size: 12px;
  font-weight: 600;
}

.form-group input,
.form-group select {
  width: 100%;
  height: 40px;

  padding: 0 11px;

  border: 1px solid var(--border);
  border-radius: 7px;

  background: var(--input-bg);
  color: var(--text);

  outline: none;

  font-size: 13px;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--primary);
}

.form-help {
  margin-top: 6px;

  color: var(--text-muted);

  font-size: 11px;
  line-height: 1.4;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;

  padding: 15px 20px;

  border-top: 1px solid var(--border);
}

.cancel-btn,
.save-btn {
  height: 38px;

  padding: 0 15px;

  border-radius: 7px;

  cursor: pointer;

  font-size: 13px;
  font-weight: 600;
}

.cancel-btn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
}

.cancel-btn:hover {
  background: var(--hover);
  color: var(--text);
}

.save-btn {
  border: 1px solid var(--primary);
  background: var(--primary);
  color: #fff;
}

.save-btn:hover {
  background: var(--primary-hover);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  .app {
    display: block;
    width: 100%;
  }

  .sidebar {
    width: 100%;
    min-width: 0;
    min-height: auto;
    height: auto;

    position: sticky;
    top: 0;
    z-index: 100;

    padding: 10px 10px 8px;

    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 18px;
    margin-bottom: 9px;
    padding: 0 5px;
  }

  .category-list {
    display: flex;
    flex-direction: row;

    gap: 7px;

    overflow-x: auto;
    overflow-y: hidden;

    padding-bottom: 3px;
  }

  .category-btn {
    flex: 0 0 auto;

    width: auto;

    white-space: nowrap;

    padding: 8px 11px;

    font-size: 12px;

    border-radius: 8px;
  }

  .header {
    min-height: auto;

    padding: 10px;

    gap: 7px;

    flex-wrap: wrap;

    position: sticky;
    top: 72px;
    z-index: 90;
  }

  .search-box {
    flex: 1 1 100%;
    order: 1;
  }

  .header-btn {
    flex: 1;
    min-width: 0;

    height: 38px;

    padding: 0 7px;

    font-size: 11px;
  }

  .content {
    padding: 17px 10px 30px;
  }

  .content-title {
    font-size: 19px;
  }

  .links-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .link-card {
    min-height: 120px;
  }

  .card-actions {
    opacity: 1;

    right: 8px;
    top: 8px;
  }

  .modal-overlay {
    padding: 10px;

    align-items: flex-start;
  }

  .modal {
    margin-top: 20px;

    max-height: calc(100vh - 40px);

    overflow-y: auto;
  }

  .modal-body {
    padding: 16px;
  }

  .modal-footer {
    padding: 13px 16px;
  }
}

/* =========================
   VERY SMALL MOBILE
========================= */

@media (max-width: 380px) {

  .header-btn {
    font-size: 10px;
    padding: 0 5px;
  }

  .link-card {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR / CATEGORY BAR -->
  <aside class="sidebar">

    <div class="logo">🔗 My Links</div>

    <div class="category-list" id="categoryList"></div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search links..."
          autocomplete="off"
        >
      </div>

      <button class="header-btn primary" id="addBtn">
        ＋ Add
      </button>

      <button class="header-btn" id="themeBtn">
        ☀️ Light
      </button>

      <button class="header-btn" id="exportBtn">
        ⬇ Export
      </button>

      <button class="header-btn" id="importBtn">
        ⬆ Import
      </button>

      <button class="header-btn danger" id="resetBtn">
        ↻ Reset
      </button>

      <input
        type="file"
        id="importFile"
        accept=".json,application/json"
        hidden
      >

    </header>


    <!-- CONTENT -->
    <section class="content">

      <div class="content-top">

        <div>
          <div class="content-title" id="contentTitle">
            All Links
          </div>

          <div class="link-count" id="linkCount">
            0 links
          </div>
        </div>

      </div>


      <div class="links-grid" id="linksGrid"></div>

    </section>

  </main>

</div>


<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title" id="modalTitle">
        Add Link
      </div>

      <button class="close-btn" id="closeModalBtn">
        ×
      </button>

    </div>


    <div class="modal-body">

      <form id="linkForm">

        <div class="form-group">

          <label for="titleInput">
            Title
          </label>

          <input
            type="text"
            id="titleInput"
            placeholder="Example: Wedding Outfit Ideas"
            required
          >

        </div>


        <div class="form-group">

          <label for="urlInput">
            URL
          </label>

          <input
            type="url"
            id="urlInput"
            placeholder="https://..."
            required
          >

          <div class="form-help">
            Link type, category and emoji are detected automatically.
          </div>

        </div>


        <div class="form-group">

          <label for="typeInput">
            Link Type
          </label>

          <select id="typeInput">

            <option value="instagram">
              📸 Instagram Reel
            </option>

            <option value="youtube-short">
              ▶️ YouTube Short
            </option>

            <option value="gmap">
              📍 GMap Link
            </option>

            <option value="google-drive">
              📁 Google Drive
            </option>

            <option value="youtube-playlist">
              ▶️ YouTube Playlist
            </option>

            <option value="myntra">
              🛍️ Myntra
            </option>

            <option value="website">
              🌐 Website
            </option>

            <option value="other">
              🔗 Other
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="categoryInput">
            Category
          </label>

          <select id="categoryInput">

            <option value="Social">
              📱 Social
            </option>

            <option value="Streaming">
              🎬 Streaming
            </option>

            <option value="Personality">
              👤 Personality
            </option>

            <option value="Weddings">
              💍 Weddings
            </option>

            <option value="Watches">
              ⌚ Watches
            </option>

            <option value="Outing">
              🗺️ Outing
            </option>

            <option value="Learning">
              📚 Learning
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="iconInput">
            Icon / Emoji
          </label>

          <input
            type="text"
            id="iconInput"
            maxlength="5"
            placeholder="🔗"
          >

        </div>

      </form>

    </div>


    <div class="modal-footer">

      <button
        class="cancel-btn"
        id="cancelModalBtn"
        type="button"
      >
        Cancel
      </button>

      <button
        class="save-btn"
        id="saveBtn"
        type="submit"
        form="linkForm"
      >
        Save Link
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const STORAGE_KEY = "myLinksDashboardData";
const THEME_KEY = "myLinksDashboardTheme";


/* =========================================================
   CATEGORIES
========================================================= */

const categories = [

  {
    name: "All",
    icon: "🏠"
  },

  {
    name: "Social",
    icon: "📱"
  },

  {
    name: "Streaming",
    icon: "🎬"
  },

  {
    name: "Personality",
    icon: "👤"
  },

  {
    name: "Weddings",
    icon: "💍"
  },

  {
    name: "Watches",
    icon: "⌚"
  },

  {
    name: "Outing",
    icon: "🗺️"
  },

  {
    name: "Learning",
    icon: "📚"
  }

];


/* =========================================================
   LINK TYPE LABELS
========================================================= */

const typeLabels = {

  instagram: "📸 Instagram Reel",

  "youtube-short": "▶️ YouTube Short",

  gmap: "📍 GMap Link",

  "google-drive": "📁 Google Drive",

  "youtube-playlist": "▶️ YouTube Playlist",

  myntra: "🛍️ Myntra",

  website: "🌐 Website",

  other: "🔗 Other"

};


/* =========================================================
   DEFAULT LINKS
   Keep this EMPTY for public GitHub version.
========================================================= */

const defaultLinks = [];


/* =========================================================
   STATE
========================================================= */

let links = [];

let currentCategory = "All";

let editingId = null;


/* =========================================================
   ELEMENTS
========================================================= */

const categoryList =
  document.getElementById("categoryList");

const linksGrid =
  document.getElementById("linksGrid");

const contentTitle =
  document.getElementById("contentTitle");

const linkCount =
  document.getElementById("linkCount");

const searchInput =
  document.getElementById("searchInput");

const addBtn =
  document.getElementById("addBtn");

const themeBtn =
  document.getElementById("themeBtn");

const exportBtn =
  document.getElementById("exportBtn");

const importBtn =
  document.getElementById("importBtn");

const resetBtn =
  document.getElementById("resetBtn");

const importFile =
  document.getElementById("importFile");

const modalOverlay =
  document.getElementById("modalOverlay");

const modalTitle =
  document.getElementById("modalTitle");

const closeModalBtn =
  document.getElementById("closeModalBtn");

const cancelModalBtn =
  document.getElementById("cancelModalBtn");

const linkForm =
  document.getElementById("linkForm");

const titleInput =
  document.getElementById("titleInput");

const urlInput =
  document.getElementById("urlInput");

const typeInput =
  document.getElementById("typeInput");

const categoryInput =
  document.getElementById("categoryInput");

const iconInput =
  document.getElementById("iconInput");


/* =========================================================
   UTILITIES
========================================================= */

function generateId() {

  return Date.now().toString(36) +
    Math.random().toString(36).substring(2, 8);

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


/* =========================================================
   LINK TYPE DETECTION
========================================================= */

function detectLinkType(url) {

  const value = String(url || "").toLowerCase();

  if (
    value.includes("instagram.com/reel") ||
    value.includes("instagram.com/reels")
  ) {
    return "instagram";
  }


  if (
    value.includes("youtube.com/shorts/") ||
    value.includes("youtu.be/shorts/")
  ) {
    return "youtube-short";
  }


  if (
    value.includes("maps.app.goo.gl") ||
    value.includes("goo.gl/maps") ||
    value.includes("google.com/maps")
  ) {
    return "gmap";
  }


  if (
    value.includes("drive.google.com") ||
    value.includes("docs.google.com")
  ) {
    return "google-drive";
  }


  if (
    value.includes("youtube.com/playlist") ||
    (
      value.includes("youtube.com/watch") &&
      value.includes("list=")
    )
  ) {
    return "youtube-playlist";
  }


  if (value.includes("myntra.com")) {
    return "myntra";
  }


  if (
    value.startsWith("http://") ||
    value.startsWith("https://")
  ) {
    return "website";
  }


  return "other";

}


/* =========================================================
   CATEGORY DETECTION
========================================================= */

function detectCategory(title, url) {

  const value = (
    String(title || "") +
    " " +
    String(url || "")
  ).toLowerCase();


  /* WEDDINGS */

  const weddingKeywords = [

    "wedding",
    "weddings",
    "marriage",
    "married",
    "bride",
    "bridal",
    "groom",
    "grooms",
    "shaadi",
    "shadi",
    "wedding card",
    "invitation",
    "save the date",
    "engagement",
    "engaged",
    "reception",
    "haldi",
    "mehendi",
    "mehndi",
    "sangeet",
    "dhoti",
    "silk dhoti",
    "wedding outfit",
    "wedding dress",
    "wedding clothes",
    "jiya jale",
    "ಹೂ ಮುಡಿಸುವ"

  ];


  if (
    weddingKeywords.some(keyword =>
      value.includes(keyword)
    )
  ) {
    return "Weddings";
  }


  /* WATCHES */

  const watchKeywords = [

    "watch",
    "watches",
    "casio",
    "sonata",
    "titan",
    "poze",
    "smartwatch",

/* =========================================================
   ICON DETECTION
========================================================= */

function detectIcon(title, url, type, category) {

  const value = (
    String(title || "") +
    " " +
    String(url || "")
  ).toLowerCase();


  if (category === "Watches") {
    return "⌚";
  }


  if (category === "Weddings") {
    return "💍";
  }


  if (
    value.includes("japanese") ||
    value.includes("jlpt") ||
    value.includes("hiragana") ||
    value.includes("katakana") ||
    value.includes("kanji")
  ) {
    return "🇯🇵";
  }


  if (
    value.includes("salesforce") ||
    value.includes("lwc") ||
    value.includes("apex")
  ) {
    return "☁️";
  }


  if (value.includes("java")) {
    return "☕";
  }


  if (
    value.includes("german") ||
    value.includes("germany")
  ) {
    return "🇩🇪";
  }


  if (type === "gmap") {
    return "📍";
  }


  if (type === "google-drive") {
    return "📁";
  }


  if (
    type === "youtube-playlist" ||
    type === "youtube-short"
  ) {
    return "▶️";
  }


  if (type === "instagram") {
    return "📸";
  }


  if (type === "myntra") {
    return "🛍️";
  }


  if (category === "Streaming") {
    return "🎬";
  }


  if (category === "Outing") {
    return "🗺️";
  }


  if (category === "Personality") {
    return "👤";
  }


  if (category === "Learning") {
    return "📚";
  }


  return "🔗";

}


/* =========================================================
   MIGRATE / RECLASSIFY IMPORTED LINKS
========================================================= */

function migrateLinks(data) {

  return data.map(item => {

    const title =
      item.title || "Untitled Link";

    const url =
      item.url || "";


    const detectedType =
      detectLinkType(url);

    const detectedCategory =
      detectCategory(title, url);

    const detectedIcon =
      detectIcon(
        title,
        url,
        detectedType,
        detectedCategory
      );


    return {

      id:
        item.id ||
        generateId(),

      title,

      url,

      type:
        detectedType,

      category:
        detectedCategory,

      icon:
        detectedIcon

    };

  });

}

   STORAGE
========================================================= */

  localStorage.setItem(

/* =========================================================
   THEME
========================================================= */

function applyTheme(theme) {

  const isLight =
    theme === "light";


  document.body.classList.toggle(
    "light",
    isLight
  );


  themeBtn.textContent =
    isLight
      ? "🌙 Dark"
      : "☀️ Light";


  localStorage.setItem(
    THEME_KEY,
    theme
  );

}


function initializeTheme() {

  const savedTheme =
    localStorage.getItem(THEME_KEY);


  if (savedTheme === "light") {

    applyTheme("light");

  } else {

    applyTheme("dark");

  }

}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories() {

  categoryList.innerHTML =
    categories.map(category => {

      const active =
        currentCategory === category.name
          ? "active"
          : "";


      return `

        <button
          class="category-btn ${active}"
          data-category="${escapeAttribute(category.name)}"
        >
          ${category.icon}
          ${escapeHTML(category.name)}
        </button>

      `;

    }).join("");


  document
    .querySelectorAll(".category-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentCategory =
            button.dataset.category;

          searchInput.value = "";

          renderCategories();

          renderLinks();

        }
      );

    });

}


/* =========================================================
   RENDER LINKS
========================================================= */

function renderLinks() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  let filtered =
    links.filter(link => {

      const matchesCategory =
        currentCategory === "All" ||
        link.category === currentCategory;


      const searchableText = (

        (link.title || "") +
        " " +
        (link.url || "") +
        " " +
        (link.type || "") +
        " " +
        (link.category || "")

      ).toLowerCase();


      const matchesSearch =
        !search ||
        searchableText.includes(search);


      return (
        matchesCategory &&
        matchesSearch
      );

    });


  contentTitle.textContent =
    currentCategory === "All"
      ? "All Links"
      : currentCategory;


  linkCount.textContent =
    `${filtered.length} ${
      filtered.length === 1
        ? "link"
        : "links"
    }`;


  if (filtered.length === 0) {

    linksGrid.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          🔗
        </div>

        <div class="empty-title">
          No links found
        </div>

        <div class="empty-text">
          Add a link or change your search/category.
        </div>

      </div>

    `;

    return;

  }


  linksGrid.innerHTML =
    filtered.map(link => {

      const safeTitle =
        escapeHTML(link.title);

      const safeUrl =
        escapeAttribute(link.url);

      const safeIcon =
        escapeHTML(link.icon || "🔗");

      const typeLabel =
        typeLabels[link.type] ||
        "🔗 Other";


      return `

        <div
          class="link-card"
          data-id="${escapeAttribute(link.id)}"
          title="${safeTitle}"
        >

          <div class="link-card-icon">
            ${safeIcon}
          </div>

          <div class="link-card-title">
            ${safeTitle}
          </div>

          <div class="link-card-type">
            ${escapeHTML(typeLabel)}
          </div>

          <div class="link-card-category">
            ${escapeHTML(link.category)}
          </div>


          <div class="card-actions">

            <button
              class="card-action edit-btn"
              data-id="${escapeAttribute(link.id)}"
              title="Edit"
            >
              ✏️
            </button>

            <button
              class="card-action delete delete-btn"
              data-id="${escapeAttribute(link.id)}"
              title="Delete"
            >
              🗑️
            </button>

          </div>

        </div>

      `;

    }).join("");


  /* CARD CLICK */

  document
    .querySelectorAll(".link-card")
    .forEach(card => {

      card.addEventListener(
        "click",
        event => {

          if (
            event.target.closest(".card-action")
          ) {
            return;
          }


          const id =
            card.dataset.id;


          const link =
            links.find(item =>
              item.id === id
            );


          if (!link || !link.url) {
            return;
          }


          window.open(
            link.url,
            "_blank",
            "noopener,noreferrer"
          );

        }
      );

    });


  /* EDIT */

  document
    .querySelectorAll(".edit-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          openEditModal(
            button.dataset.id
          );

        }
      );

    });


  /* DELETE */

  document
    .querySelectorAll(".delete-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          deleteLink(
            button.dataset.id
          );

        }
      );

    });

}


/* =========================================================
   MODAL
========================================================= */

function openAddModal() {

  editingId = null;

  modalTitle.textContent =
    "Add Link";

  linkForm.reset();

  typeInput.value =
    "website";

  categoryInput.value =
    "Social";

  iconInput.value =
    "🔗";


  modalOverlay.classList.add(
    "show"
  );


  titleInput.focus();

}


function openEditModal(id) {

  const link =
    links.find(item =>
      item.id === id
    );


  if (!link) {
    return;
  }


  editingId = id;


  modalTitle.textContent =
    "Edit Link";


  titleInput.value =
    link.title || "";


  urlInput.value =
    link.url || "";


  typeInput.value =
    link.type || "website";


  categoryInput.value =
    link.category || "Social";


  iconInput.value =
    link.icon || "🔗";


  modalOverlay.classList.add(
    "show"
  );


  titleInput.focus();

}


function closeModal() {

  modalOverlay.classList.remove(
    "show"
  );

  editingId = null;

}


/* =========================================================
   AUTO DETECTION WHILE ENTERING URL
========================================================= */

urlInput.addEventListener(
  "input",
  () => {

    const url =
      urlInput.value.trim();

    const title =
      titleInput.value.trim();


    if (!url) {
      return;
    }


    const detectedType =
      detectLinkType(url);


    const detectedCategory =
      detectCategory(
        title,
        url
      );


    const detectedIcon =
      detectIcon(
        title,
        url,
        detectedType,
        detectedCategory
      );


    typeInput.value =
      detectedType;


    categoryInput.value =
      detectedCategory;


    iconInput.value =
      detectedIcon;

  }
);


/* =========================================================
   AUTO DETECTION WHILE ENTERING TITLE
========================================================= */

titleInput.addEventListener(
  "input",
  () => {

    const title =
      titleInput.value.trim();

    const url =
      urlInput.value.trim();


    if (!title && !url) {
      return;
    }


    const detectedCategory =
      detectCategory(
        title,
        url
      );


    const detectedIcon =
      detectIcon(
        title,
        url,
        detectLinkType(url),
        detectedCategory
      );


    categoryInput.value =
      detectedCategory;


    iconInput.value =
      detectedIcon;

  }
);


/* =========================================================
   SAVE LINK
========================================================= */

linkForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const title =
      titleInput.value.trim();

    const url =
      urlInput.value.trim();


    if (!title || !url) {
      return;
    }


    const type =
      typeInput.value ||
      detectLinkType(url);


    const category =
      categoryInput.value ||
      detectCategory(
        title,
        url
      );


    const icon =
      iconInput.value.trim() ||
      detectIcon(
        title,
        url,
        type,
        category
      );


    if (editingId) {

      const index =
        links.findIndex(
          item =>
            item.id === editingId
        );


      if (index !== -1) {

        links[index] = {

          ...links[index],

          title,

          url,

          type,

          category,

          icon

        };

      }

    } else {

      links.push({

        id:
          generateId(),

        title,

        url,

        type,

        category,

        icon

      });

    }


    saveLinks();

    closeModal();

    renderCategories();

    renderLinks();

  }
);


/* =========================================================
   DELETE LINK
========================================================= */

function deleteLink(id) {

  const link =
    links.find(item =>
      item.id === id
    );


  if (!link) {
    return;
  }


  const confirmed =
    confirm(
      `Delete "${link.title}"?`
    );


  if (!confirmed) {
    return;
  }


  links =
    links.filter(item =>
      item.id !== id
    );


  saveLinks();

  renderCategories();

  renderLinks();

}


/* =========================================================
   EXPORT
========================================================= */

function exportLinks() {

  const data =
    JSON.stringify(
      links,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  const date =
    new Date()
      .toISOString()
      .slice(0, 10);


  link.href = url;

  link.download =
    `my-links-backup-${date}.json`;


  document.body.appendChild(
    link
  );


  link.click();

  link.remove();


  URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORT
========================================================= */

importBtn.addEventListener(
  "click",
  () => {

    importFile.click();

  }
);


importFile.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      event => {

        try {

          const parsed =
            JSON.parse(
              event.target.result
            );


          if (!Array.isArray(parsed)) {

            alert(
              "Invalid JSON backup format."
            );

            return;

          }


          const confirmed =
            confirm(
              "Importing will replace your current links. Continue?"
            );


          if (!confirmed) {
            return;
          }


          links =
            migrateLinks(parsed);


          saveLinks();


          currentCategory =
            "All";


          searchInput.value =
            "";


          renderCategories();

          renderLinks();


          alert(
            `${links.length} links imported successfully.`
          );

        } catch (error) {

          alert(
            "Could not read the JSON file."
          );

        }

      };


    reader.readAsText(file);


    /* Allow importing the same file again */

    importFile.value = "";

  }
);


/* =========================================================
   RESET
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    const confirmed =
      confirm(
        "Reset all saved links? This cannot be undone."
      );


    if (!confirmed) {
      return;
    }


    links = [];

    currentCategory =
      "All";

    searchInput.value =
      "";


    saveLinks();

    renderCategories();

    renderLinks();

  }
);


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    renderLinks();

  }
);


/* =========================================================
   THEME TOGGLE
========================================================= */

themeBtn.addEventListener(
  "click",
  () => {

    const currentTheme =
      document.body.classList.contains("light")

        : "dark";


    applyTheme(
      currentTheme === "dark"

    );

);

========================================================= */

);

  "click",

);


cancelModalBtn.addEventListener(

);

  "click",

    if (
      event.target === modalOverlay
    ) {
      closeModal();
    }

  }

/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      modalOverlay.classList.contains("show")
    ) {

      closeModal();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

  /* Theme */

  initializeTheme();


  /* Links */

  const stored =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (stored) {

    try {

      const parsed =
        JSON.parse(stored);


      links =
        Array.isArray(parsed)
          ? migrateLinks(parsed)
          : [];


    } catch (error) {

      links = [];

    }

  } else {

    links =
      [...defaultLinks];

  }


  saveLinks();


  currentCategory =
    "All";


  renderCategories();

  renderLinks();

}


/* START */

initialize();
